name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    name: Setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          install-hex: true
          install-rebar: true
          version-type: strict
          version-file: .tool-versions

      # Define how to cache deps. Restores existing cache if present.
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        env:
          cache-name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-

      # Define how to cache the `_build` directory. After the first run,
      # this speeds up tests runs a lot. This includes not re-compiling our
      # project's downloaded deps every run.
      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v5
        env:
          cache-name: cache-compiled-build-v2
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}

      # Cache precompiled NIF archives so they don't need to be
      # re-downloaded when _build cache misses.
      - name: Cache precompiled NIFs
        uses: actions/cache@v5
        with:
          path: ~/.cache/rustler_precompiled
          key: ${{ runner.os }}-nif-precompiled-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-nif-precompiled-

      # Download project dependencies. If unchanged, uses
      # the cached version.
      - name: Install dependencies
        run: mix deps.get

      # Compile deps so the _build cache saved by this job is complete for
      # downstream build/test jobs. --force ensures this always runs.
      - name: Compile dependencies
        run: mix deps.compile --force

  conformancy:
    runs-on: ubuntu-24.04
    name: Conformancy
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check links
        uses: jesse-c/clevis-action@v0.2.1
        with:
          command: 'check'

  lint:
    runs-on: ubuntu-24.04
    name: Lint
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          install-hex: true
          install-rebar: true
          version-type: strict
          version-file: .tool-versions

      # Define how to cache deps. Restores existing cache if present.
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        env:
          cache-name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-

      # Define how to cache the `_build` directory. After the first run,
      # this speeds up tests runs a lot. This includes not re-compiling our
      # project's downloaded deps every run.
      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v5
        env:
          cache-name: cache-compiled-build-v2
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-
            ${{ runner.os }}-mix-

      # Cache precompiled NIF archives so they don't need to be
      # re-downloaded when _build cache misses.
      - name: Cache precompiled NIFs
        uses: actions/cache@v5
        with:
          path: ~/.cache/rustler_precompiled
          key: ${{ runner.os }}-nif-precompiled-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-nif-precompiled-

      - name: Install D2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      # Force-compile NIF deps so rustler_precompiled extracts the .so into
      # deps/<dep>/priv/native/ before project code tries to load the module.
      - name: Compile NIF deps
        run: mix deps.compile --force lumis

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check code analysis
        run: mix credo --all

      - name: Check links
        run: mix check_links

      - name: Check spelling
        uses: crate-ci/typos@master

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          install-hex: true
          install-rebar: true
          version-type: strict
          version-file: .tool-versions

      # Define how to cache deps. Restores existing cache if present.
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        env:
          cache-name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-

      # Define how to cache the `_build` directory. After the first run,
      # this speeds up tests runs a lot. This includes not re-compiling our
      # project's downloaded deps every run.
      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v5
        env:
          cache-name: cache-compiled-build-v2
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}

      # Cache precompiled NIF archives so they don't need to be
      # re-downloaded when _build cache misses.
      - name: Cache precompiled NIFs
        uses: actions/cache@v5
        with:
          path: ~/.cache/rustler_precompiled
          key: ${{ runner.os }}-nif-precompiled-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-nif-precompiled-

      - name: Install D2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      # Force-compile NIF deps so rustler_precompiled extracts the .so into
      # deps/<dep>/priv/native/ before project code tries to load the module.
      - name: Compile NIF deps
        run: mix deps.compile --force lumis

      - name: Compiles without warnings
        run: mix compile --warnings-as-errors

  test:
    runs-on: ubuntu-24.04
    name: Test
    needs: build
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          install-hex: true
          install-rebar: true
          version-type: strict
          version-file: .tool-versions

      # Define how to cache deps. Restores existing cache if present.
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        env:
          cache-name: cache-elixir-deps
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-

      # Define how to cache the `_build` directory. After the first run,
      # this speeds up tests runs a lot. This includes not re-compiling our
      # project's downloaded deps every run.
      - name: Cache compiled build
        id: cache-build
        uses: actions/cache@v5
        env:
          cache-name: cache-compiled-build-v2
        with:
          path: _build
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}

      # Cache precompiled NIF archives so they don't need to be
      # re-downloaded when _build cache misses.
      - name: Cache precompiled NIFs
        uses: actions/cache@v5
        with:
          path: ~/.cache/rustler_precompiled
          key: ${{ runner.os }}-nif-precompiled-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-nif-precompiled-

      - name: Install D2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      # Force-compile NIF deps so rustler_precompiled extracts the .so into
      # deps/<dep>/priv/native/ before project code tries to load the module.
      - name: Compile NIF deps
        run: mix deps.compile --force lumis

      - name: Run tests
        run: mix test
